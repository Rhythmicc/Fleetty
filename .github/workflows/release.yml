name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, build, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build Linux release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for fleetty_arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${fleetty_arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/fleetty_linux_${fleetty_arch}" \
              ./cmd/fleetty
          done
          cp deploy/fleetty.service dist/fleetty.service
          cp deploy/fleetty-hub.service dist/fleetty-hub.service
          cp deploy/hub-nodes.example.json dist/hub-nodes.example.json
          cp deploy/machine-nas.example.json dist/machine-nas.example.json
          (
            cd dist
            sha256sum fleetty_linux_* fleetty*.service *.example.json > checksums.txt
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Fleetty ${GITHUB_REF_NAME}"
